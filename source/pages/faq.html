 "faq": [
  ["What is Raven Corps?", "A community group for adults who want real-world skills: map and compass, bushcraft, first aid, fitness and being ready for emergencies. It started in Frodsham, Cheshire, and runs in local chapters, with sections for children to follow."],
  ["Who can join?", "Anyone aged 18 or over. No experience is needed. Sections for children from age 4 are planned to open from September 2027, once trained and checked leaders are in place."],
  ["How much does it cost?", "Meetups are free for now, while we get started. Later there will be a membership fee, and newcomers will always be able to try three meetups free first."],
  ["When and where do you meet?", "The Frodsham chapter meets on the third Saturday of every month, 1pm to 3pm. The first meetup is on Saturday 23 January 2027 in Delamere Forest. The exact meeting point is emailed to everyone who signs up. See <a href=\"/meetups/\">the meetups page</a>."],
  ["What do I need to bring?", "Walking boots, a waterproof, warm layers and gloves, your own food, and a drink for The Roost. A compass if you have one. Everything else is provided."],
  ["How fit do I need to be?", "If you can walk for a couple of hours on uneven ground, you'll be fine. We go at the pace of the slowest person, and some sessions build fitness gradually."],
  ["What is The Roost?", "How every meetup ends: sitting on a log with a drink you've brought yourself, a hipflask or a flask of something hot. It's where people get to know each other. Drivers stick to hot drinks."],
  ["Is Raven Corps a military organisation?", "No. It's a civilian community group. The ranks, uniform and drill borrow from cadet traditions because they work, but Raven Corps isn't part of or connected to the armed forces. Ex-forces members are very welcome."],
  ["Is it religious?", "No. Our Code draws on the values that shaped Britain, and everyone is welcome, whatever they believe."],
  ["How do you keep people safe?", "Every meetup has a risk assessment and a leader with a first aid kit, and we only meet where the landowner has agreed. Anyone working with under-18s has an enhanced DBS check, references and safeguarding training, and there are always at least two adults."],
  ["Do you teach self-defence?", "Yes, as one of the skills, with the emphasis on staying aware, avoiding trouble and getting away. It's taught by qualified instructors, within the law, and adults and children learn different things."],
  ["I'm not near Frodsham. Can I still join?", "Yes. Sign up and tell us your region. When enough people near you have joined, and someone will help lead it, we'll help start a chapter there. See <a href=\"/start-a-chapter/\">how chapters start</a>."],
  ["Can I help run it?", "Please do. We're looking for ex-forces and cadet instructors, outdoor and bushcraft leaders, first aiders, teachers and youth workers, and organised people for admin and money. Sign up and tick \"Helping to run or instruct\"."],
